
name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          mkdir -p android-project
          unzip -q MovieLink-Android-Compose.zip -d android-project

      - name: Verify project
        run: |
          test -f android-project/settings.gradle.kts
          test -f android-project/app/build.gradle.kts

      - name: Build Release APK
        working-directory: android-project
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MovieLink-release-apk
          path: android-project/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          
